services:
  mysql:
    image: mysql:8.0
    container_name: "${MYSQL_CONTAINER:-app_mysql}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-app_db}"
      MYSQL_USER: "${MYSQL_USER:-app_admin}"
      MYSQL_PASSWORD: "${MYSQL_USER_PASSWORD}"
    command: >
      --innodb_buffer_pool_size=64M
      --performance_schema=OFF
      --max_connections=20
      --innodb_log_buffer_size=8M
      --innodb_redo_log_capacity=32M
      --table_open_cache=64
      --thread_cache_size=4
      --key_buffer_size=8M
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
    # 이미 쓰던 볼륨이 있으면 .env의 MYSQL_VOLUME에 그 이름을 지정한다
    name: "${MYSQL_VOLUME:-app_mysql_data}"
    driver: local
